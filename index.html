<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A">
    <title>البث المباشر | المباريات</title>

    <!-- ===== Video.js 8 ===== -->
    <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.16.1/video.min.js">
    </script>

    <!-- ===== Font Awesome & Tajawal ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #7B2FBE;
            --primary-dark: #5E2B97;
            --primary-light: #A855F7;
            --primary-glow: rgba(123, 47, 190, 0.35);
            --bg-primary: #0A0A0A;
            --bg-card: #161616;
            --bg-card-hover: #1f1f1f;
            --border-subtle: #2a2a2a;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 20px 90px 20px;
            opacity: 0;
            transition: opacity 1.2s ease;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body.loaded {
            opacity: 1;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* ===== HEADER ===== */
        .app-header {
            max-width: 1440px;
            margin: 0 auto 32px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            min-width: 200px;
            max-width: 480px;
            position: relative;
        }

        .search-wrapper .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #888;
            font-size: 0.95rem;
        }

        .search-bar {
            width: 100%;
            padding: 14px 48px 14px 20px;
            border-radius: 60px;
            border: 1.5px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
            text-align: right;
            direction: rtl;
            backdrop-filter: blur(4px);
        }

        .search-bar::placeholder {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .search-bar:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        /* ===== GRID ===== */
        .posters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 28px 20px;
            max-width: 1440px;
            margin: 0 auto;
            justify-items: center;
            align-items: start;
        }

        /* ===== CARD ===== */
        .poster-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 260px;
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            position: relative;
            will-change: transform;
            animation: cardFadeUp 0.6s ease both;
        }

        .poster-card:nth-child(1) { animation-delay: 0.05s; }
        .poster-card:nth-child(2) { animation-delay: 0.10s; }
        .poster-card:nth-child(3) { animation-delay: 0.15s; }
        .poster-card:nth-child(4) { animation-delay: 0.20s; }
        .poster-card:nth-child(5) { animation-delay: 0.25s; }
        .poster-card:nth-child(6) { animation-delay: 0.30s; }
        .poster-card:nth-child(7) { animation-delay: 0.35s; }
        .poster-card:nth-child(8) { animation-delay: 0.40s; }
        .poster-card:nth-child(9) { animation-delay: 0.45s; }
        .poster-card:nth-child(10) { animation-delay: 0.50s; }

        @keyframes cardFadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poster-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, transparent 40%, var(--primary), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .poster-card:hover::after {
            opacity: 1;
        }

        .poster-card:hover {
            transform: translateY(-6px) scale(1.015);
            border-color: var(--primary-glow);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(123, 47, 190, 0.25);
            background: var(--bg-card-hover);
        }

        .poster-card:active {
            transform: translateY(-2px) scale(0.98);
            transition-duration: 0.08s;
        }

        .poster-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.4s ease;
            will-change: opacity, transform;
        }

        .poster-card img.skeleton {
            background: linear-gradient(110deg, #1a1a1a 8%, #2c2c2c 18%, #1a1a1a 33%);
            background-size: 200% 100%;
            animation: shimmer 1.6s linear infinite;
            opacity: 1;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .poster-card img.loaded {
            opacity: 1;
        }

        .poster-card:hover img {
            transform: scale(1.04);
            filter: brightness(1.05) saturate(1.05);
        }

        .match-title {
            padding: 14px 12px 16px;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
            background: linear-gradient(0deg, var(--bg-card) 80%, transparent);
            color: var(--text-primary);
            border-top: 1px solid var(--border-subtle);
            transition: var(--transition);
            line-height: 1.4;
            position: relative;
        }

        .match-title .badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 2px 10px;
            border-radius: 30px;
            background: rgba(123, 47, 190, 0.25);
            color: #C084FC;
            margin-top: 4px;
            border: 1px solid rgba(123, 47, 190, 0.2);
        }

        .poster-card:hover .match-title {
            background: var(--bg-card-hover);
            border-top-color: rgba(123, 47, 190, 0.2);
        }

        /* ===== NO RESULTS ===== */
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px 20px;
            font-size: 1.15rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 32px;
            border: 1px dashed var(--border-subtle);
            margin-top: 20px;
        }

        /* ===== MODAL (half selection) ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            animation: fadeModal 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeModal {
            from { opacity: 0; transform: scale(0.94) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-content {
            background: linear-gradient(145deg, #181818, #0e0e0e);
            border-radius: 24px;
            padding: 36px 28px 32px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .modal-content h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .modal-content p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-btn {
            width: 100%;
            padding: 16px 12px;
            border-radius: 14px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid var(--border-subtle);
            position: relative;
            overflow: hidden;
        }

        .modal-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: var(--transition);
            border-radius: 14px;
        }

        .modal-btn:hover::after {
            opacity: 1;
        }
        .modal-btn span {
            position: relative;
            z-index: 1;
        }
        .modal-btn:hover {
            border-color: var(--primary);
            transform: scale(1.02);
        }
        .modal-btn:active {
            transform: scale(0.96);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .modal-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* ===== VIDEO PLAYER OVERLAY (شفاف مع تأثير زجاجي) ===== */
        .video-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 4000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeVideoIn 0.4s ease;
        }

        .video-overlay.active {
            display: flex;
        }

        .video-overlay.closing {
            animation: fadeVideoOut 0.3s ease forwards;
        }

        @keyframes fadeVideoIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeVideoOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }

        .video-container {
            width: 90%;
            max-width: 1200px;
            height: auto;
            max-height: 85vh;
            aspect-ratio: 16 / 9;
            position: relative;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(123, 47, 190, 0.2);
            transition: all 0.3s ease;
        }

        /* عند تصغير الفيديو (بعد الخروج من ملء الشاشة) نجعله أصغر قليلاً */
        .video-container.shrink {
            width: 70%;
            max-width: 800px;
            max-height: 70vh;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent !important;
            display: block;
        }

        /* ===== Video.js Professional Styling (بنفسجي) ===== */
        .video-js {
            font-family: 'Tajawal', sans-serif;
            background: transparent !important;
        }
        
        .video-js .vjs-tech {
            background: transparent !important;
        }

        .video-js .vjs-control-bar {
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.2) 70%, transparent 100%);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: none;
            padding-bottom: 10px;
            padding-top: 6px;
            border-radius: 0 0 20px 20px;
        }

        .video-js .vjs-big-play-button {
            background: rgba(123, 47, 190, 0.9) !important;
            border: none !important;
            border-radius: 50% !important;
            width: 76px !important;
            height: 76px !important;
            line-height: 76px !important;
            font-size: 2rem !important;
            box-shadow: 0 0 40px rgba(123, 47, 190, 0.4);
            transition: var(--transition);
        }

        .video-js .vjs-big-play-button:hover {
            background: var(--primary) !important;
            transform: scale(1.08);
            box-shadow: 0 0 60px rgba(123, 47, 190, 0.6);
        }

        .video-js .vjs-control:focus,
        .video-js .vjs-control:hover {
            color: #C084FC !important;
        }

        .video-js .vjs-progress-holder .vjs-play-progress {
            background: linear-gradient(90deg, var(--primary), var(--primary-light)) !important;
        }

        .video-js .vjs-progress-holder .vjs-load-progress {
            background: rgba(255, 255, 255, 0.15) !important;
        }

        .video-js .vjs-slider {
            background: rgba(255, 255, 255, 0.15) !important;
        }

        .video-js .vjs-time-control {
            font-size: 0.9rem;
            padding: 0 6px;
        }

        /* ===== CLOSE VIDEO BUTTON ===== */
        .video-close {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 15;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 1.4rem;
            font-family: inherit;
        }

        .video-close:hover {
            background: rgba(123, 47, 190, 0.75);
            border-color: var(--primary);
            transform: rotate(90deg) scale(1.05);
        }

        /* ===== QUALITY & STRETCH BUTTONS (بنفسجي) ===== */
        .vjs-quality-button,
        .vjs-stretch-button {
            cursor: pointer;
            padding: 0 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
            background: none;
            border: none;
            font-family: inherit;
            height: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vjs-quality-button:hover,
        .vjs-stretch-button:hover {
            color: #C084FC;
        }

        .vjs-quality-button .quality-label,
        .vjs-stretch-button .mode-label {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .vjs-quality-menu {
            position: absolute;
            bottom: 52px;
            right: 10px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 8px 4px;
            min-width: 140px;
            display: none;
            flex-direction: column;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        .vjs-quality-menu.open {
            display: flex;
        }

        .vjs-quality-menu .quality-item {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: right;
            background: none;
            border: none;
            font-family: inherit;
            width: 100%;
        }

        .vjs-quality-menu .quality-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .vjs-quality-menu .quality-item.active {
            color: #fff;
            background: rgba(123, 47, 190, 0.25);
        }
        .vjs-quality-menu .quality-item .check {
            margin-left: 8px;
            color: var(--primary);
        }

        /* ===== TOAST (بنفسجي) ===== */
        .toast {
            position: fixed;
            bottom: -100px;
            right: 24px;
            left: auto;
            background: #161616;
            color: var(--text-primary);
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 5000;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 340px;
            border-left: 4px solid var(--primary);
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }

        .toast.show {
            bottom: 28px;
        }

        .toast-icon {
            font-size: 1.5rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        .toast-content {
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 2px 6px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .toast-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            body {
                padding: 16px 14px 80px 14px;
            }
            .app-header {
                margin-bottom: 24px;
            }
            .search-wrapper {
                max-width: 100%;
            }
            .search-bar {
                padding: 12px 44px 12px 16px;
                font-size: 0.85rem;
            }
            .posters-grid {
                gap: 16px 12px;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .match-title {
                font-size: 0.78rem;
                padding: 10px 8px 12px;
            }
            .modal-content {
                padding: 28px 20px 24px;
                max-width: 290px;
            }
            .video-container {
                width: 100%;
                max-height: 60vh;
                border-radius: 0;
            }
            .video-container.shrink {
                width: 95%;
                max-height: 50vh;
            }
            .video-close {
                top: 12px;
                right: 14px;
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            .video-js .vjs-big-play-button {
                width: 56px !important;
                height: 56px !important;
                line-height: 56px !important;
                font-size: 1.4rem !important;
            }
            .vjs-quality-menu {
                min-width: 110px;
                right: 4px;
            }
            .vjs-quality-menu .quality-item {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .toast {
                right: 16px;
                left: 16px;
                max-width: 100%;
                padding: 12px 16px;
            }
            .toast.show {
                bottom: 16px;
            }
        }

        @media (min-width: 1024px) {
            .posters-grid {
                grid-template-columns: repeat(5, minmax(190px, 230px));
                justify-content: center;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            .posters-grid {
                gap: 12px;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .match-title {
                padding: 6px 6px 8px;
                font-size: 0.7rem;
            }
        }

        .hidden {
            display: none !important;
        }
        img {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="ابحث عن مباراة..." autocomplete="off" />
        </div>
    </header>

    <!-- ===== GRID ===== -->
    <div class="posters-grid" id="postersGrid"></div>

    <!-- ===== HALF SELECTION MODAL ===== -->
    <div class="modal-overlay" id="halfModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <h3>⚡ اختر الشوط</h3>
            <p>المباراة متوفرة بشوطين منفصلين</p>
            <div class="modal-buttons">
                <button class="modal-btn" id="btnFirst"><span>🥅 الشوط الأول</span></button>
                <button class="modal-btn" id="btnSecond"><span>⚽ الشوط الثاني</span></button>
            </div>
        </div>
    </div>

    <!-- ===== VIDEO PLAYER OVERLAY (شفاف) ===== -->
    <div class="video-overlay" id="videoOverlay">
        <button class="video-close" id="videoClose" aria-label="إغلاق المشغل">✕</button>
        <div class="video-container" id="videoContainer">
            <video id="myPlayer" class="video-js vjs-big-play-centered" controls autoplay preload="auto"
            playsinline data-setup='{"fluid":true, "liveui":true, "html5": {"hls": {"enableLowInitialPlaylist": true, "overrideNative": true}}}'>
        </video>
    </div>
</div>

<!-- ===== TOAST (رابط تلغرام جديد) ===== -->
<div class="toast" id="telegramToast">
    <i class="fas fa-paper-plane toast-icon"></i>
    <div class="toast-content">
        تابعنا على التليجرام للحصول على آخر التحديثات
    </div>
    <i class="fas fa-times toast-close" id="toastClose"></i>
</div>

<!-- ===== SCRIPTS ===== -->
<script>
    (function() {
        'use strict';

        // ============================================================
        //  1. MATCH DATA
        // ============================================================
        const matchesData = [{
            title: "RM × INT",
            imgSrc: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh-cfAgTWpSqtQl-ZHvfpc-1eNISTa74YqaR9xHU_AZ9Wn2pTF9IqO8RErP25PHKio0GKKXEZCIFKHfMKjd88KjxMiqsc16sS6i-kPJ6_N4T6Pj8LZWU_8k9YL1Y64LJgMBgAKrzArQH3cNrbNBDjtuEF05Y4BcAeSz-UaLz0p7fLhDMCOUnkxO-3DzXdK1/s320/6f100a09-4d61-499a-9f4a-d9bbaf5d0d8f.jpeg",
            link: "https://stream.mux.com/AOU3DSkbwDNQXACSu7thEbvID00WkHiJNSMrM00012aMz00.m3u8"
        }
            
        ];

        // ============================================================
        //  2. DOM REFS
        // ============================================================
        const grid = document.getElementById('postersGrid');
        const searchInput = document.getElementById('searchInput');
        const halfModal = document.getElementById('halfModal');
        const modalClose = document.getElementById('modalClose');
        const btnFirst = document.getElementById('btnFirst');
        const btnSecond = document.getElementById('btnSecond');
        const videoOverlay = document.getElementById('videoOverlay');
        const videoClose = document.getElementById('videoClose');
        const videoContainer = document.getElementById('videoContainer');
        const toastEl = document.getElementById('telegramToast');
        const toastClose = document.getElementById('toastClose');

        let player = null;
        let currentStretchMode = 'contain';
        let pendingLink = null;
        let toastTimer = null;
        let isClosing = false; // منع تكرار الإغلاق

        // ============================================================
        //  3. TOAST (رابط تلغرام محدث)
        // ============================================================
        const TELEGRAM_LINK = 'https://t.me/RealMadridNews015';

        function showToast() {
            if (!toastEl) return;
            if (toastTimer) { clearTimeout(toastTimer);
                toastTimer = null; }
            toastEl.classList.remove('show');
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 5000);
        }

        function hideToast() {
            if (!toastEl) return;
            toastEl.classList.remove('show');
            if (toastTimer) { clearTimeout(toastTimer);
                toastTimer = null; }
        }

        if (toastClose) {
            toastClose.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                hideToast();
            });
        }
        toastEl.addEventListener('click', function(e) {
            if (e.target.closest('.toast-close')) return;
            window.open(TELEGRAM_LINK, '_blank');
        });

        window.addEventListener('load', function() { setTimeout(showToast, 600); });

        // ============================================================
        //  4. BUILD CARD
        // ============================================================
        function createPosterCard(match) {
            const card = document.createElement('div');
            card.className = 'poster-card';
            const isArray = Array.isArray(match.link);

            card.addEventListener('click', function(e) {
                e.preventDefault();
                if (isArray && match.link.length >= 2) {
                    pendingLink = match.link;
                    halfModal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                } else {
                    openVideoPlayer(match.link);
                }
            });

            const img = document.createElement('img');
            img.src = match.imgSrc;
            img.alt = match.title;
            img.loading = 'lazy';
            img.classList.add('skeleton');

            img.addEventListener('load', function() {
                this.classList.remove('skeleton');
                this.classList.add('loaded');
            });
            img.addEventListener('error', function() {
                this.classList.remove('skeleton');
                this.style.backgroundColor = '#1a1a1a';
                this.classList.add('loaded');
                this.style.opacity = '1';
            });
            if (img.complete) {
                if (img.naturalWidth !== 0) {
                    img.classList.remove('skeleton');
                    img.classList.add('loaded');
                } else {
                    img.classList.remove('skeleton');
                    img.style.backgroundColor = '#1a1a1a';
                    img.classList.add('loaded');
                    img.style.opacity = '1';
                }
            }

            const titleDiv = document.createElement('div');
            titleDiv.className = 'match-title';
            titleDiv.innerHTML = match.title +
                (isArray ? ' <span class="badge">شوطين</span>' : '');

            card.appendChild(img);
            card.appendChild(titleDiv);
            return card;
        }

        // ============================================================
        //  5. RENDER & SEARCH
        // ============================================================
        function render(filter = '') {
            grid.innerHTML = '';
            const lower = filter.trim().toLowerCase();
            const filtered = lower === '' ? matchesData : matchesData.filter(m =>
                m.title.toLowerCase().includes(lower)
            );
            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'no-results';
                empty.textContent = '⚽ لا توجد مباراة تطابق البحث';
                grid.appendChild(empty);
                return;
            }
            filtered.forEach(m => grid.appendChild(createPosterCard(m)));
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));
        render('');

        // ============================================================
        //  6. HALF MODAL
        // ============================================================
        function closeModal() {
            halfModal.classList.remove('active');
            document.body.style.overflow = '';
            pendingLink = null;
        }
        modalClose.addEventListener('click', closeModal);
        halfModal.addEventListener('click', function(e) { if (e.target === halfModal) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

        btnFirst.addEventListener('click', function() {
            if (pendingLink && Array.isArray(pendingLink) && pendingLink[0]) {
                closeModal();
                openVideoPlayer(pendingLink[0]);
            }
        });
        btnSecond.addEventListener('click', function() {
            if (pendingLink && Array.isArray(pendingLink) && pendingLink[1]) {
                closeModal();
                openVideoPlayer(pendingLink[1]);
            }
        });

        // ============================================================
        //  7. VIDEO PLAYER (Fullscreen ONLY in landscape)
        // ============================================================
        function openVideoPlayer(src) {
            // إزالة أي حالة إغلاق سابقة
            if (isClosing) return;
            videoOverlay.classList.remove('closing');
            videoOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            // إزالة خاصية التصغير إن وجدت
            videoContainer.classList.remove('shrink');

            if (!player) {
                const videoEl = document.getElementById('myPlayer');
                player = videojs(videoEl, {
                    controls: true,
                    autoplay: true,
                    preload: 'auto',
                    fluid: true,
                    liveui: true,
                    html5: {
                        hls: {
                            enableLowInitialPlaylist: true,
                            overrideNative: true,
                            handleManifestRedirects: true
                        }
                    },
                    controlBar: {
                        children: [
                            'playToggle', 'volumePanel', 'currentTimeDisplay',
                            'timeDivider', 'durationDisplay', 'progressControl',
                            'liveDisplay', 'remainingTimeDisplay',
                            'customQuality', 'customStretch', 'fullscreenToggle'
                        ]
                    }
                });

                // ---- Custom quality ----
                const qualityButton = document.createElement('button');
                qualityButton.className = 'vjs-quality-button vjs-control';
                qualityButton.setAttribute('aria-label', 'جودة الفيديو');
                qualityButton.innerHTML =
                    `<span class="quality-label" id="qualityLabel">HD</span><span style="font-size:0.7rem;">▾</span>`;
                const qualityMenu = document.createElement('div');
                qualityMenu.className = 'vjs-quality-menu';
                qualityMenu.id = 'qualityMenu';
                qualityButton.appendChild(qualityMenu);
                qualityButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    qualityMenu.classList.toggle('open');
                });
                document.addEventListener('click', function() { qualityMenu.classList.remove('open'); });
                qualityMenu.addEventListener('click', function(e) { e.stopPropagation(); });

                // ---- Custom stretch ----
                const stretchButton = document.createElement('button');
                stretchButton.className = 'vjs-stretch-button vjs-control';
                stretchButton.setAttribute('aria-label', 'تغيير حجم الفيديو');
                stretchButton.innerHTML =
                    `<span class="mode-icon">⊞</span><span class="mode-label" id="stretchLabel">ملائم</span>`;
                stretchButton.addEventListener('click', function() { cycleStretchMode(); });

                // ---- Register ----
                player.ready(function() {
                    const controlBar = this.controlBar;
                    const fsIndex = controlBar.children().indexOf(controlBar.getChild('fullscreenToggle'));
                    if (fsIndex !== -1) controlBar.addChild('component', { el: qualityButton }, fsIndex);
                    else controlBar.addChild('component', { el: qualityButton });

                    const qIndex = controlBar.children().indexOf(controlBar.getChild('customQuality'));
                    if (qIndex !== -1) controlBar.addChild('component', { el: stretchButton }, qIndex);
                    else controlBar.addChild('component', { el: stretchButton });

                    const qLevels = this.qualityLevels ? this.qualityLevels() : null;
                    if (qLevels) {
                        qLevels.on('addqualitylevel', function() { buildQualityMenu(qLevels); });
                        if (qLevels.length > 0) buildQualityMenu(qLevels);
                    }
                    this.on('loadedmetadata', function() {
                        const levels = this.qualityLevels ? this.qualityLevels() : null;
                        if (levels && levels.length > 0) buildQualityMenu(levels);
                        applyStretch(currentStretchMode);
                        handleOrientationAndFullscreen();
                    });
                    this.on('fullscreenchange', function() { handleOrientationAndFullscreen(); });

                    if (screen.orientation) {
                        screen.orientation.addEventListener('change', function() {
                            if (videoOverlay.classList.contains('active')) handleOrientationAndFullscreen();
                        });
                    } else {
                        window.addEventListener('resize', function() {
                            if (videoOverlay.classList.contains('active')) handleOrientationAndFullscreen();
                        });
                    }
                    if (window.ResizeObserver) {
                        const ro = new ResizeObserver(function() {
                            if (videoOverlay.classList.contains('active')) handleOrientationAndFullscreen();
                        });
                        ro.observe(videoContainer);
                        player._resizeObserver = ro;
                    }
                });

                player.qualityButton = qualityButton;
                player.qualityMenu = qualityMenu;
                player.stretchButton = stretchButton;

                player.on('dispose', function() {
                    qualityButton.remove();
                    stretchButton.remove();
                });

                function cycleStretchMode() {
                    const modes = ['contain', 'fill'];
                    let idx = modes.indexOf(currentStretchMode);
                    idx = (idx + 1) % modes.length;
                    currentStretchMode = modes[idx];
                    applyStretch(currentStretchMode);
                    updateStretchLabel(currentStretchMode);
                }

                function applyStretch(mode) {
                    if (!player) return;
                    const videoEl = player.el().querySelector('video');
                    if (!videoEl) return;
                    videoEl.style.objectFit = (mode === 'fill') ? 'fill' : 'contain';
                    currentStretchMode = mode;
                    updateStretchLabel(mode);
                }

                function updateStretchLabel(mode) {
                    const labelEl = document.getElementById('stretchLabel');
                    if (!labelEl) return;
                    labelEl.textContent = (mode === 'fill') ? 'تمديد' : 'ملائم';
                }
                window.cycleStretch = cycleStretchMode;

                function buildQualityMenu(levels) {
                    const menu = document.getElementById('qualityMenu');
                    const label = document.getElementById('qualityLabel');
                    if (!menu) return;
                    menu.innerHTML = '';
                    const items = [];
                    for (let i = 0; i < levels.length; i++) {
                        const l = levels[i];
                        if (!l || typeof l.height !== 'number') continue;
                        let labelText = '';
                        if (l.height >= 720) labelText = 'HD';
                        else if (l.height >= 480) labelText = 'SD';
                        else labelText = l.height + 'p';
                        if (l.bitrate) {
                            const mbps = (l.bitrate / 1000000).toFixed(1);
                            labelText += ' ' + mbps + 'Mbps';
                        }
                        items.push({ level: l, label: labelText, height: l.height, bitrate: l.bitrate || 0 });
                    }
                    items.sort((a, b) => b.height - a.height);
                    if (items.length === 0) {
                        const fallback = document.createElement('button');
                        fallback.className = 'quality-item active';
                        fallback.textContent = 'HD';
                        menu.appendChild(fallback);
                        if (label) label.textContent = 'HD';
                        return;
                    }
                    let activeLevel = null;
                    for (const item of items) { if (item.level.enabled) { activeLevel = item; break; } }
                    if (!activeLevel && items.length > 0) activeLevel = items[0];
                    if (label && activeLevel) {
                        const short = activeLevel.height >= 720 ? 'HD' : activeLevel.height >= 480 ? 'SD' : activeLevel
                            .height + 'p';
                        label.textContent = short;
                    }
                    items.forEach((item) => {
                        const btn = document.createElement('button');
                        btn.className = 'quality-item';
                        if (activeLevel && item.level === activeLevel.level) {
                            btn.classList.add('active');
                            btn.innerHTML = item.label + ' <span class="check">✓</span>';
                        } else { btn.textContent = item.label; }
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            for (let i = 0; i < levels.length; i++) { levels[i].enabled = false; }
                            item.level.enabled = true;
                            const allItems = menu.querySelectorAll('.quality-item');
                            allItems.forEach(el => {
                                el.classList.remove('active');
                                const txt = el.textContent.replace(' ✓', '');
                                el.textContent = txt;
                            });
                            this.classList.add('active');
                            this.innerHTML = item.label + ' <span class="check">✓</span>';
                            if (label) {
                                const short = item.height >= 720 ? 'HD' : item.height >= 480 ? 'SD' : item
                                    .height + 'p';
                                label.textContent = short;
                            }
                            menu.classList.remove('open');
                        });
                        menu.appendChild(btn);
                    });
                }
                window.buildQualityMenu = buildQualityMenu;

                if (player && player.qualityLevels) {
                    const ql = player.qualityLevels();
                    if (ql) {
                        ql.on('addqualitylevel', function() {
                            const levels = player.qualityLevels();
                            if (levels && levels.length > 0) buildQualityMenu(levels);
                        });
                    }
                }
            } // end if !player

            player.src({ src: src, type: 'application/x-mpegURL' });
            player.play().catch(function() {});

            function handleOrientationAndFullscreen() {
                if (!player) return;
                const isLandscape = window.innerWidth > window.innerHeight;
                const isFullscreen = player.isFullscreen ? player.isFullscreen() : false;

                if (isLandscape && !isFullscreen) {
                    try { player.requestFullscreen(); } catch (e) {
                        try { const el = player.el(); if (el && el.requestFullscreen) el.requestFullscreen(); } catch (
                        e2) {}
                    }
                } else if (!isLandscape && isFullscreen) {
                    try { player.exitFullscreen(); } catch (e) {
                        try { if (document.exitFullscreen) document.exitFullscreen(); } catch (e2) {}
                    }
                }
                let targetMode = 'contain';
                if (isLandscape && (player.isFullscreen ? player.isFullscreen() : false)) {
                    targetMode = 'fill';
                } else { targetMode = 'contain'; }
                currentStretchMode = targetMode;
                applyStretch(targetMode);
                updateStretchLabel(targetMode);
                const videoEl = player.el().querySelector('video');
                if (videoEl) { videoEl.style.objectFit = (targetMode === 'fill') ? 'fill' : 'contain'; }

                // عند الخروج من ملء الشاشة نضيف خاصية التصغير لجعل الحجم مناسباً
                if (!isFullscreen && videoOverlay.classList.contains('active')) {
                    videoContainer.classList.add('shrink');
                } else {
                    videoContainer.classList.remove('shrink');
                }
            }

            player.handleOrientation = handleOrientationAndFullscreen;

            setTimeout(function() {
                handleOrientationAndFullscreen();
                setTimeout(handleOrientationAndFullscreen, 400);
            }, 300);

            if (player._orientationHandler) {
                if (screen.orientation) { screen.orientation.removeEventListener('change', player._orientationHandler); }
                else { window.removeEventListener('resize', player._orientationHandler); }
            }
            const handler = function() {
                if (videoOverlay.classList.contains('active')) { handleOrientationAndFullscreen(); }
            };
            if (screen.orientation) { screen.orientation.addEventListener('change', handler); } 
            else { window.addEventListener('resize', handler); }
            player._orientationHandler = handler;

            setTimeout(function() { if (player && player.el()) { player.el().focus(); } }, 400);
        }

        // ============================================================
        //  8. CLOSE VIDEO (مع أنيميشن fade out)
        // ============================================================
        function closeVideo() {
            if (isClosing) return;
            isClosing = true;
            // إضافة كلاس الإغلاق لتشغيل الأنيميشن
            videoOverlay.classList.add('closing');
            // إزالة خاصية التصغير
            videoContainer.classList.remove('shrink');

            // بعد انتهاء الأنيميشن ننهي الإغلاق
            setTimeout(function() {
                videoOverlay.classList.remove('active', 'closing');
                document.body.style.overflow = '';
                if (player) {
                    player.pause();
                    if (player.isFullscreen && player.isFullscreen()) { try { player.exitFullscreen(); } catch (e) {} }
                    if (player._resizeObserver) { try { player._resizeObserver.disconnect(); } catch (e) {} }
                    if (player._orientationHandler) {
                        if (screen.orientation) { screen.orientation.removeEventListener('change', player._orientationHandler); }
                        else { window.removeEventListener('resize', player._orientationHandler); }
                    }
                }
                isClosing = false;
            }, 350); // مدة الأنيميشن 0.3s + 50ms
        }

        videoClose.addEventListener('click', closeVideo);
        videoOverlay.addEventListener('click', function(e) { if (e.target === videoOverlay) closeVideo(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && videoOverlay.classList.contains('active')) {
                closeVideo();
            }
        });

        // ============================================================
        //  9. التعامل مع زر الرجوع (popstate) لتقليص المشغل
        // ============================================================
        window.addEventListener('popstate', function(e) {
            if (videoOverlay.classList.contains('active')) {
                // إذا كان في وضع ملء الشاشة، نخرج منه أولاً (ليصغر)
                if (player && player.isFullscreen && player.isFullscreen()) {
                    try { player.exitFullscreen(); } catch (ex) {}
                    // بعد الخروج سيتولى حدث fullscreenchange التعامل مع التصغير
                } else {
                    // إذا لم يكن في ملء الشاشة، نغلق المشغل
                    closeVideo();
                }
            }
        });

        // ============================================================
        //  10. منع النسخ والاختصارات
        // ============================================================
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's') || e.key === 'F12') {
                e.preventDefault();
            }
        });

        window.addEventListener('load', function() { document.body.classList.add('loaded'); });

        // ============================================================
        //  11. مراقبة تغييرات الفيديو لتطبيق stretch
        // ============================================================
        const observer = new MutationObserver(function() {
            if (player && videoOverlay.classList.contains('active')) {
                const videoEl = player.el ? player.el().querySelector('video') : null;
                if (videoEl) {
                    const isLandscape = window.innerWidth > window.innerHeight;
                    const isFullscreen = player.isFullscreen ? player.isFullscreen() : false;
                    let mode = 'contain';
                    if (isLandscape && isFullscreen) mode = 'fill';
                    videoEl.style.objectFit = mode;
                }
            }
        });
        observer.observe(videoContainer, { childList: true, subtree: true });

        if (videojs) {
            videojs.hook('setup', function(player) {
                player.on('loadedmetadata', function() {
                    const videoEl = this.el().querySelector('video');
                    if (videoEl) {
                        const isLandscape = window.innerWidth > window.innerHeight;
                        const isFullscreen = this.isFullscreen ? this.isFullscreen() : false;
                        let mode = 'contain';
                        if (isLandscape && isFullscreen) mode = 'fill';
                        videoEl.style.objectFit = mode;
                    }
                });
            });
        }

        console.log('🎬 VAR Player — بنفسجي قاتم | أنيميشن fade | زر رجوع يعيد التصغير');
    })();
</script>
