<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A">
    <title>Real Madrid</title>

    <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --primary: #7B2FBE;
            --primary-dark: #5E2B97;
            --primary-light: #A855F7;
            --primary-glow: rgba(123, 47, 190, 0.35);
            --bg-primary: #0A0A0A;
            --bg-card: #161616;
            --bg-card-hover: #1f1f1f;
            --border-subtle: #2a2a2a;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 20px 90px 20px;
            opacity: 0;
            transition: opacity 1.2s ease;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        body.loaded { opacity: 1; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .app-header {
            max-width: 1440px;
            margin: 0 auto 32px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .search-wrapper { flex: 1; min-width: 200px; max-width: 480px; position: relative; }
        .search-wrapper .search-icon {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            pointer-events: none; color: #888; font-size: 0.95rem;
        }
        .search-bar {
            width: 100%; padding: 14px 48px 14px 20px; border-radius: 60px;
            border: 1.5px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.04); color: #fff;
            font-size: 0.95rem; font-weight: 500; outline: none;
            transition: var(--transition); font-family: inherit;
            text-align: right; direction: rtl; backdrop-filter: blur(4px);
        }
        .search-bar::placeholder { color: var(--text-secondary); font-weight: 400; }
        .search-bar:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .posters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 28px 20px; max-width: 1440px; margin: 0 auto;
            justify-items: center; align-items: start;
        }

        .poster-card {
            display: flex; flex-direction: column; width: 100%; max-width: 260px;
            background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
            border: 1px solid var(--border-subtle); transition: var(--transition);
            cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            position: relative; will-change: transform;
            animation: cardFadeUp 0.6s ease both;
        }
        .poster-card:nth-child(1) { animation-delay: 0.05s; }
        .poster-card:nth-child(2) { animation-delay: 0.10s; }
        .poster-card:nth-child(3) { animation-delay: 0.15s; }
        .poster-card:nth-child(4) { animation-delay: 0.20s; }
        .poster-card:nth-child(5) { animation-delay: 0.25s; }

        @keyframes cardFadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poster-card::after {
            content: ''; position: absolute; inset: -1px;
            border-radius: var(--radius); padding: 1px;
            background: linear-gradient(135deg, transparent 40%, var(--primary), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: var(--transition); pointer-events: none;
        }
        .poster-card:hover::after { opacity: 1; }
        .poster-card:hover {
            transform: translateY(-6px) scale(1.015);
            border-color: var(--primary-glow);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(123, 47, 190, 0.25);
            background: var(--bg-card-hover);
        }
        .poster-card:active { transform: translateY(-2px) scale(0.98); transition-duration: 0.08s; }
        .poster-card img {
            width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
            background: #1a1a1a; opacity: 0;
            transition: opacity 0.5s ease, transform 0.4s ease;
            will-change: opacity, transform;
        }
        .poster-card img.skeleton {
            background: linear-gradient(110deg, #1a1a1a 8%, #2c2c2c 18%, #1a1a1a 33%);
            background-size: 200% 100%; animation: shimmer 1.6s linear infinite; opacity: 1;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .poster-card img.loaded { opacity: 1; }
        .poster-card:hover img { transform: scale(1.04); filter: brightness(1.05) saturate(1.05); }

        .match-title {
            padding: 14px 12px 16px; text-align: center; font-weight: 700;
            font-size: 0.95rem; letter-spacing: 0.2px;
            background: linear-gradient(0deg, var(--bg-card) 80%, transparent);
            color: var(--text-primary); border-top: 1px solid var(--border-subtle);
            transition: var(--transition); line-height: 1.4; position: relative;
        }
        .poster-card:hover .match-title {
            background: var(--bg-card-hover);
            border-top-color: rgba(123, 47, 190, 0.2);
        }

        .no-results {
            text-align: center; grid-column: 1 / -1; padding: 60px 20px;
            font-size: 1.15rem; color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 32px; border: 1px dashed var(--border-subtle); margin-top: 20px;
        }

        .modal-overlay {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center;
            z-index: 3000; padding: 20px; animation: fadeModal 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeModal {
            from { opacity: 0; transform: scale(0.94) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-content {
            background: linear-gradient(145deg, #181818, #0e0e0e);
            border-radius: 24px; padding: 36px 28px 32px; width: 100%;
            max-width: 340px; text-align: center;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.9); position: relative;
        }
        .modal-content h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .modal-content p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }
        .modal-buttons { display: flex; flex-direction: column; gap: 12px; }
        .modal-btn {
            width: 100%; padding: 16px 12px; border-radius: 14px; border: none;
            font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit;
            transition: var(--transition); background: rgba(255, 255, 255, 0.06);
            color: #fff; border: 1px solid var(--border-subtle);
            position: relative; overflow: hidden;
        }
        .modal-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            opacity: 0; transition: var(--transition); border-radius: 14px;
        }
        .modal-btn:hover::after { opacity: 1; }
        .modal-btn span { position: relative; z-index: 1; }
        .modal-btn:hover { border-color: var(--primary); transform: scale(1.02); }
        .modal-btn:active { transform: scale(0.96); }
        .modal-close {
            position: absolute; top: 14px; right: 18px; background: none;
            border: none; color: var(--text-secondary); font-size: 1.5rem;
            cursor: pointer; transition: var(--transition);
            padding: 4px 8px; border-radius: 8px;
        }
        .modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }

        /* ===== VIDEO OVERLAY ===== */
        .video-overlay {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            z-index: 4000; display: none; flex-direction: column;
            align-items: center; justify-content: center;
            animation: fadeVideoIn 0.4s ease;
        }
        .video-overlay.active { display: flex; }
        .video-overlay.closing { animation: fadeVideoOut 0.3s ease forwards; }
        @keyframes fadeVideoIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeVideoOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }

        .video-container {
            width: 90%; max-width: 1200px; height: auto; max-height: 85vh;
            aspect-ratio: 16 / 9; position: relative;
            background: transparent !important; display: flex;
            align-items: center; justify-content: center;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(123, 47, 190, 0.2);
            transition: all 0.3s ease;
        }
        .video-container.normal {
            width: 70%; max-width: 800px; max-height: 70vh;
        }
        .video-container.fullscreen-landscape {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            aspect-ratio: auto !important;
            box-shadow: none !important;
            background: #000 !important;
        }
        .video-container video {
            width: 100%; height: 100%; object-fit: contain;
            background: transparent !important; display: block;
            transform-origin: center center;
            transition: transform 0.3s ease, object-fit 0.3s ease;
        }

        /* ⭐ في الوضع الأفقي العادي → حجم مصغر مريح */
        @media (orientation: landscape) {
            .video-container.normal {
                width: auto !important;
                height: 55vh !important;
                max-width: 75vw !important;
                max-height: 55vh !important;
                aspect-ratio: 16 / 9 !important;
                border-radius: 16px !important;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(123, 47, 190, 0.2) !important;
            }
        }

        /* ===== Video.js Styling ===== */
        .video-js { font-family: 'Tajawal', sans-serif; background: transparent !important; }
        .video-js .vjs-tech { background: transparent !important; }

        .video-js .vjs-control-bar {
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.25) 70%, transparent 100%);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            border: none;
            padding: 6px 6px 8px 6px;
            border-radius: 0 0 20px 20px;
            display: flex !important;
            flex-wrap: nowrap !important;
            overflow: visible !important;
            align-items: center;
            gap: 2px;
            /* ⭐ لا نفرض الظهور — نترك التحكم للإخفاء التلقائي */
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        /* ⭐⭐ إخفاء لوحة التحكم (بعد 3 ثوانٍ أو بضغط المستخدم على الفيديو) */
        .video-js.vjs-controls-hidden .vjs-control-bar {
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .video-js.vjs-controls-hidden .vjs-big-play-button {
            visibility: hidden !important;
            opacity: 0 !important;
        }

        .video-js .vjs-control-bar > * { flex-shrink: 0; }
        .video-js .vjs-progress-control {
            flex: 1 1 auto !important;
            min-width: 30px;
        }
        .video-js .vjs-progress-control .vjs-progress-holder { margin: 0 4px; }
        .video-js .vjs-play-control,
        .video-js .vjs-volume-panel,
        .video-js .vjs-fullscreen-control { padding: 0 4px !important; }
        .video-js .vjs-current-time,
        .video-js .vjs-duration,
        .video-js .vjs-time-divider,
        .video-js .vjs-remaining-time { display: none !important; }

        .video-js .vjs-big-play-button {
            background: rgba(123, 47, 190, 0.9) !important;
            border: none !important; border-radius: 50% !important;
            width: 76px !important; height: 76px !important;
            line-height: 76px !important; font-size: 2rem !important;
            box-shadow: 0 0 40px rgba(123, 47, 190, 0.4);
            transition: var(--transition);
        }
        .video-js .vjs-big-play-button:hover {
            background: var(--primary) !important;
            transform: scale(1.08);
            box-shadow: 0 0 60px rgba(123, 47, 190, 0.6);
        }
        .video-js .vjs-control:focus,
        .video-js .vjs-control:hover { color: #C084FC !important; }
        .video-js .vjs-progress-holder .vjs-play-progress {
            background: linear-gradient(90deg, var(--primary), var(--primary-light)) !important;
        }
        .video-js .vjs-progress-holder .vjs-load-progress {
            background: rgba(255, 255, 255, 0.15) !important;
        }
        .video-js .vjs-slider { background: rgba(255, 255, 255, 0.15) !important; }

        .video-close {
            position: absolute; top: 20px; right: 24px; z-index: 15;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition);
            backdrop-filter: blur(8px); color: #fff;
            font-size: 1.4rem; font-family: inherit;
            visibility: visible !important; opacity: 1 !important;
        }
        .video-close:hover {
            background: rgba(123, 47, 190, 0.75);
            border-color: var(--primary);
            transform: rotate(90deg) scale(1.05);
        }

        .vjs-quality-button,
        .vjs-stretch-button {
            cursor: pointer;
            padding: 0 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: var(--transition);
            background: none;
            border: none;
            font-family: inherit;
            height: 100%;
            position: relative;
        }
        .vjs-quality-button:hover,
        .vjs-stretch-button:hover { color: #C084FC; }

        .vjs-quality-button .quality-label,
        .vjs-stretch-button .mode-label {
            font-size: 0.6rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
        }

        .vjs-quality-menu,
        .vjs-stretch-menu {
            position: absolute; bottom: 52px; right: 10px;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 12px; padding: 6px 4px;
            min-width: 140px; display: none; flex-direction: column;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
            z-index: 30;
        }
        .vjs-quality-menu.open,
        .vjs-stretch-menu.open { display: flex; }
        .vjs-quality-menu .quality-item,
        .vjs-stretch-menu .stretch-item {
            padding: 8px 14px; cursor: pointer; border-radius: 8px;
            font-size: 0.8rem; font-weight: 500; color: var(--text-secondary);
            transition: var(--transition); text-align: right;
            background: none; border: none; font-family: inherit; width: 100%;
            display: flex; align-items: center; justify-content: space-between;
        }
        .vjs-quality-menu .quality-item:hover,
        .vjs-stretch-menu .stretch-item:hover {
            background: rgba(255, 255, 255, 0.06); color: #fff;
        }
        .vjs-quality-menu .quality-item.active,
        .vjs-stretch-menu .stretch-item.active {
            color: #fff; background: rgba(123, 47, 190, 0.25);
        }
        .vjs-quality-menu .quality-item .check { margin-left: 8px; color: var(--primary); }

        .toast {
            position: fixed; bottom: -100px; right: 24px; left: auto;
            background: #161616; color: var(--text-primary);
            padding: 14px 20px; border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; gap: 14px;
            z-index: 5000;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 340px; border-left: 4px solid var(--primary);
            cursor: pointer; font-family: 'Tajawal', sans-serif;
        }
        .toast.show { bottom: 28px; }
        .toast-icon { font-size: 1.5rem; color: var(--primary); flex-shrink: 0; }
        .toast-content { flex: 1; font-size: 0.9rem; line-height: 1.4; }
        .toast-close {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1.1rem; cursor: pointer; transition: var(--transition);
            padding: 2px 6px; border-radius: 6px; flex-shrink: 0;
        }
        .toast-close:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }

        @media (max-width: 640px) {
            body { padding: 16px 14px 80px 14px; }
            .app-header { margin-bottom: 24px; }
            .search-wrapper { max-width: 100%; }
            .search-bar { padding: 12px 44px 12px 16px; font-size: 0.85rem; }
            .posters-grid { gap: 16px 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .match-title { font-size: 0.78rem; padding: 10px 8px 12px; }
            .modal-content { padding: 28px 20px 24px; max-width: 290px; }
            .video-container { width: 100%; max-height: 60vh; border-radius: 0; }
            .video-container.normal { width: 95%; max-height: 50vh; }
            .video-close { top: 12px; right: 14px; width: 40px; height: 40px; font-size: 1.1rem; }
            .video-js .vjs-big-play-button {
                width: 56px !important; height: 56px !important;
                line-height: 56px !important; font-size: 1.4rem !important;
            }
            .video-js .vjs-volume-panel { display: none !important; }
            .video-js .vjs-quality-button .quality-label,
            .video-js .vjs-stretch-button .mode-label {
                font-size: 0.55rem;
                padding: 2px 5px;
            }
            .vjs-quality-menu,
            .vjs-stretch-menu { min-width: 120px; right: 4px; }
            .vjs-quality-menu .quality-item,
            .vjs-stretch-menu .stretch-item {
                padding: 6px 10px; font-size: 0.72rem;
            }
            .toast { right: 16px; left: 16px; max-width: 100%; padding: 12px 16px; }
            .toast.show { bottom: 16px; }
        }

        @media (max-width: 420px) {
            .video-js .vjs-quality-button .quality-label,
            .video-js .vjs-stretch-button .mode-label {
                display: none;
            }
        }

        @media (min-width: 1024px) {
            .posters-grid {
                grid-template-columns: repeat(5, minmax(190px, 230px));
                justify-content: center;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            .posters-grid { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .match-title { padding: 6px 6px 8px; font-size: 0.7rem; }
        }

        .hidden { display: none !important; }
        img { pointer-events: none; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="ابحث عن مباراة..." autocomplete="off" />
        </div>
    </header>

    <div class="posters-grid" id="postersGrid"></div>

    <div class="modal-overlay" id="halfModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <h3>⚡ اختر الشوط</h3>
            <p>المباراة متوفرة بشوطين منفصلين</p>
            <div class="modal-buttons">
                <button class="modal-btn" id="btnFirst"><span>🥅 الشوط الأول</span></button>
                <button class="modal-btn" id="btnSecond"><span>⚽ الشوط الثاني</span></button>
            </div>
        </div>
    </div>

    <div class="video-overlay" id="videoOverlay">
        <button class="video-close" id="videoClose" aria-label="إغلاق المشغل">✕</button>
        <div class="video-container normal" id="videoContainer">
            <video id="myPlayer" class="video-js vjs-big-play-centered" controls autoplay preload="auto"
            playsinline data-setup='{"fluid":true, "liveui":true, "html5": {"hls": {"enableLowInitialPlaylist": true, "overrideNative": true}}}'>
        </video>
    </div>
</div>

<div class="toast" id="telegramToast">
    <i class="fas fa-paper-plane toast-icon"></i>
    <div class="toast-content">تابعنا على التليجرام للحصول على آخر التحديثات</div>
    <i class="fas fa-times toast-close" id="toastClose"></i>
</div>

<script>
    (function() {
        'use strict';

        const matchesData = [{
    title: "RM × INT",
    imgSrc: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh-cfAgTWpSqtQl-ZHvfpc-1eNISTa74YqaR9xHU_AZ9Wn2pTF9IqO8RErP25PHKio0GKKXEZCIFKHfMKjd88KjxMiqsc16sS6i-kPJ6_N4T6Pj8LZWU_8k9YL1Y64LJgMBgAKrzArQH3cNrbNBDjtuEF05Y4BcAeSz-UaLz0p7fLhDMCOUnkxO-3DzXdK1/s320/6f100a09-4d61-499a-9f4a-d9bbaf5d0d8f.jpeg",
    link: "https://stream.mux.com/AOU3DSkbwDNQXACSu7thEbvID00WkHiJNSMrM00012aMz00.m3u8"
}
            
        ];

        const grid = document.getElementById('postersGrid');
        const searchInput = document.getElementById('searchInput');
        const halfModal = document.getElementById('halfModal');
        const modalClose = document.getElementById('modalClose');
        const btnFirst = document.getElementById('btnFirst');
        const btnSecond = document.getElementById('btnSecond');
        const videoOverlay = document.getElementById('videoOverlay');
        const videoClose = document.getElementById('videoClose');
        const videoContainer = document.getElementById('videoContainer');
        const toastEl = document.getElementById('telegramToast');
        const toastClose = document.getElementById('toastClose');

        let player = null;
        let currentStretchMode = 'contain';
        let pendingLink = null;
        let toastTimer = null;
        let isClosing = false;
        let isAutoQuality = true;
        let isTransitioning = false;

        // ⭐ مدة إخفاء لوحة التحكم (3 ثوانٍ)
        const CONTROLS_HIDE_DELAY = 3000;

        // ============ TOAST ============
        const TELEGRAM_LINK = 'https://t.me/RealMadridNews015';
        function showToast() {
            if (!toastEl) return;
            if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
            toastEl.classList.remove('show');
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 5000);
        }
        function hideToast() {
            if (!toastEl) return;
            toastEl.classList.remove('show');
            if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
        }
        if (toastClose) {
            toastClose.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation(); hideToast();
            });
        }
        toastEl.addEventListener('click', function(e) {
            if (e.target.closest('.toast-close')) return;
            window.open(TELEGRAM_LINK, '_blank');
        });
        window.addEventListener('load', function() { setTimeout(showToast, 600); });

        // ============ BUILD CARD ============
        function createPosterCard(match) {
            const card = document.createElement('div');
            card.className = 'poster-card';
            const isArray = Array.isArray(match.link);

            card.addEventListener('click', function(e) {
                e.preventDefault();
                if (isArray && match.link.length >= 2) {
                    pendingLink = match.link;
                    halfModal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                } else {
                    openVideoPlayer(match.link);
                }
            });

            const img = document.createElement('img');
            img.src = match.imgSrc;
            img.alt = match.title;
            img.loading = 'lazy';
            img.classList.add('skeleton');
            img.addEventListener('load', function() {
                this.classList.remove('skeleton'); this.classList.add('loaded');
            });
            img.addEventListener('error', function() {
                this.classList.remove('skeleton');
                this.style.backgroundColor = '#1a1a1a';
                this.classList.add('loaded'); this.style.opacity = '1';
            });
            if (img.complete) {
                if (img.naturalWidth !== 0) {
                    img.classList.remove('skeleton'); img.classList.add('loaded');
                } else {
                    img.classList.remove('skeleton');
                    img.style.backgroundColor = '#1a1a1a';
                    img.classList.add('loaded'); img.style.opacity = '1';
                }
            }

            const titleDiv = document.createElement('div');
            titleDiv.className = 'match-title';
            titleDiv.innerHTML = match.title +
                (isArray ? ' <span style="display:inline-block;font-size:0.6rem;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;padding:2px 10px;border-radius:30px;background:rgba(123,47,190,0.25);color:#C084FC;margin-top:4px;border:1px solid rgba(123,47,190,0.2);">شوطين</span>' : '');

            card.appendChild(img); card.appendChild(titleDiv);
            return card;
        }

        // ============ RENDER ============
        function render(filter = '') {
            grid.innerHTML = '';
            const lower = filter.trim().toLowerCase();
            const filtered = lower === '' ? matchesData : matchesData.filter(m => m.title.toLowerCase().includes(lower));
            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'no-results';
                empty.textContent = '⚽ لا توجد مباراة تطابق البحث';
                grid.appendChild(empty); return;
            }
            filtered.forEach(m => grid.appendChild(createPosterCard(m)));
        }
        searchInput.addEventListener('input', (e) => render(e.target.value));
        render('');

        // ============ HALF MODAL ============
        function closeModal() {
            halfModal.classList.remove('active');
            document.body.style.overflow = '';
            pendingLink = null;
        }
        modalClose.addEventListener('click', closeModal);
        halfModal.addEventListener('click', function(e) { if (e.target === halfModal) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
        btnFirst.addEventListener('click', function() {
            if (pendingLink && Array.isArray(pendingLink) && pendingLink[0]) {
                closeModal(); openVideoPlayer(pendingLink[0]);
            }
        });
        btnSecond.addEventListener('click', function() {
            if (pendingLink && Array.isArray(pendingLink) && pendingLink[1]) {
                closeModal(); openVideoPlayer(pendingLink[1]);
            }
        });

        // ============ VIDEO PLAYER ============
        function openVideoPlayer(src) {
            if (isClosing) return;
            videoOverlay.classList.remove('closing');
            videoOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            // ⭐ دائماً نبدأ بالوضع المصغر
            videoContainer.classList.add('normal');
            videoContainer.classList.remove('fullscreen-landscape');
            isAutoQuality = true;
            currentStretchMode = 'contain';
            isTransitioning = false;

            if (!player) {
                const videoEl = document.getElementById('myPlayer');
                player = videojs(videoEl, {
                    controls: true, autoplay: true, preload: 'auto',
                    fluid: true, liveui: true,
                    inactivityTimeout: CONTROLS_HIDE_DELAY,   // ⭐ 3 ثوانٍ
                    html5: {
                        hls: {
                            enableLowInitialPlaylist: true,
                            overrideNative: true,
                            handleManifestRedirects: true
                        }
                    },
                    controlBar: {
                        children: [
                            'playToggle', 'volumePanel', 'progressControl',
                            'liveDisplay', 'customQuality', 'customStretch', 'fullscreenToggle'
                        ]
                    }
                });

                // ============ زر الجودة ============
                const qualityButton = document.createElement('button');
                qualityButton.className = 'vjs-quality-button vjs-control';
                qualityButton.setAttribute('aria-label', 'جودة الفيديو');
                qualityButton.innerHTML = `<span class="quality-label" id="qualityLabel">تلقائي</span><span style="font-size:0.65rem;">▾</span>`;
                const qualityMenu = document.createElement('div');
                qualityMenu.className = 'vjs-quality-menu';
                qualityMenu.id = 'qualityMenu';
                qualityButton.appendChild(qualityMenu);
                qualityButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const sm = document.getElementById('stretchMenu');
                    if (sm) sm.classList.remove('open');
                    qualityMenu.classList.toggle('open');
                });
                document.addEventListener('click', function() { qualityMenu.classList.remove('open'); });
                qualityMenu.addEventListener('click', function(e) { e.stopPropagation(); });

                // ============ زر حجم الشاشة ============
                const stretchButton = document.createElement('button');
                stretchButton.className = 'vjs-stretch-button vjs-control';
                stretchButton.setAttribute('aria-label', 'تغيير حجم الفيديو');
                stretchButton.innerHTML = `<span class="mode-icon">⛶</span><span class="mode-label" id="stretchLabel">ملائم</span>`;
                const stretchMenu = document.createElement('div');
                stretchMenu.className = 'vjs-stretch-menu';
                stretchMenu.id = 'stretchMenu';

                const stretchOptions = [
                    { mode: 'contain', label: 'ملائم (افتراضي)' },
                    { mode: 'fill', label: 'تمديد' },
                    { mode: 'cover', label: 'تغطية' },
                    { mode: 'zoom-110', label: 'تكبير 110%' },
                    { mode: 'zoom-125', label: 'تكبير 125%' },
                    { mode: 'zoom-150', label: 'تكبير 150%' },
                    { mode: 'zoom-200', label: 'تكبير 200%' }
                ];
                stretchOptions.forEach(function(opt) {
                    const item = document.createElement('button');
                    item.className = 'stretch-item';
                    item.dataset.mode = opt.mode;
                    item.textContent = opt.label;
                    if (opt.mode === 'contain') item.classList.add('active');
                    item.addEventListener('click', function(e) {
                        e.stopPropagation();
                        setStretchMode(opt.mode);
                        stretchMenu.classList.remove('open');
                    });
                    stretchMenu.appendChild(item);
                });

                stretchButton.appendChild(stretchMenu);
                stretchButton.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const qm = document.getElementById('qualityMenu');
                    if (qm) qm.classList.remove('open');
                    stretchMenu.classList.toggle('open');
                });
                stretchMenu.addEventListener('click', function(e) { e.stopPropagation(); });

                // ============ تسجيل الأزرار ============
                player.ready(function() {
                    const controlBar = this.controlBar;
                    const fsIndex = controlBar.children().indexOf(controlBar.getChild('fullscreenToggle'));
                    if (fsIndex !== -1) controlBar.addChild('component', { el: qualityButton }, fsIndex);
                    else controlBar.addChild('component', { el: qualityButton });

                    const qIndex = controlBar.children().indexOf(controlBar.getChild('customQuality'));
                    if (qIndex !== -1) controlBar.addChild('component', { el: stretchButton }, qIndex);
                    else controlBar.addChild('component', { el: stretchButton });

                    const qLevels = this.qualityLevels ? this.qualityLevels() : null;
                    if (qLevels) {
                        qLevels.on('addqualitylevel', function() { buildQualityMenu(qLevels); });
                        if (qLevels.length > 0) buildQualityMenu(qLevels);
                    }

                    this.on('loadedmetadata', function() {
                        const levels = this.qualityLevels ? this.qualityLevels() : null;
                        if (levels && levels.length > 0) buildQualityMenu(levels);
                        setAutoQuality();
                        setStretchMode('contain');
                        // ⭐ لا fullscreen تلقائي أبداً
                        videoContainer.classList.add('normal');
                        videoContainer.classList.remove('fullscreen-landscape');
                    });

                    // ============================================================
                    // ⭐⭐ إدارة إظهار / إخفاء لوحة التحكم
                    // ============================================================
                    const self = this;
                    let hideTimer = null;
                    let touchUsed = false;

                    function clearHideTimer() {
                        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                    }

                    // جدولة الإخفاء بعد 3 ثوانٍ (فقط أثناء التشغيل)
                    function scheduleHide() {
                        clearHideTimer();
                        if (!self || self.paused()) return;
                        hideTimer = setTimeout(function() {
                            if (self && !self.paused()) {
                                self.addClass('vjs-controls-hidden');
                            }
                        }, CONTROLS_HIDE_DELAY);
                    }

                    function showControls() {
                        if (!self) return;
                        clearHideTimer();
                        self.removeClass('vjs-controls-hidden');
                        scheduleHide();
                    }

                    function hideControls() {
                        if (!self) return;
                        clearHideTimer();
                        self.addClass('vjs-controls-hidden');
                    }

                    function toggleControls() {
                        if (!self) return;
                        if (self.hasClass('vjs-controls-hidden')) showControls();
                        else hideControls();
                    }

                    // إتاحتها للاستخدام خارجياً
                    self.showControls = showControls;
                    self.hideControls = hideControls;
                    self.toggleControls = toggleControls;

                    // ⭐ ضغطة واحدة على الفيديو → إخفاء / إظهار اللوحة
                    this.on('click', function(e) {
                        const t = e && e.target;
                        if (t && t.closest && t.closest('.vjs-control-bar')) return; // تجاهل نقرات الأزرار
                        toggleControls();
                    });

                    // ⭐ ضغطتان → ملء الشاشة (بديل النقرة الواحدة القديمة)
                    this.on('dblclick', function(e) {
                        const t = e && e.target;
                        if (t && t.closest && t.closest('.vjs-control-bar')) return;
                        toggleFullscreenLandscape();
                    });

                    // حركة الماوس (سطح المكتب) → إظهار اللوحة
                    this.on('touchstart', function() { touchUsed = true; });
                    this.on('mousemove', function() { if (!touchUsed) showControls(); });

                    // التشغيل → إظهار اللوحة ثم إخفاؤها تلقائياً بعد 3 ثوانٍ
                    this.on('play', function() { showControls(); });
                    this.on('playing', function() { scheduleHide(); });

                    // الإيقاف المؤقت / الانتهاء → تبقى اللوحة ظاهرة
                    this.on('pause', function() { clearHideTimer(); self.removeClass('vjs-controls-hidden'); });
                    this.on('ended', function() { clearHideTimer(); self.removeClass('vjs-controls-hidden'); });

                    // ⭐ fullscreenchange: فقط تحديث الكلاسات والحجم
                    this.on('fullscreenchange', function() {
                        const isFullscreen = this.isFullscreen ? this.isFullscreen() : false;

                        if (isFullscreen) {
                            videoContainer.classList.remove('normal');
                            videoContainer.classList.add('fullscreen-landscape');
                            setStretchMode('fill');
                            videoClose.style.display = 'none';
                        } else {
                            videoContainer.classList.add('normal');
                            videoContainer.classList.remove('fullscreen-landscape');
                            setStretchMode('contain');
                            videoClose.style.display = 'flex';
                        }
                        // إظهار اللوحة بعد تغيير الوضع ثم إخفاؤها تلقائياً
                        showControls();
                    });
                });

                player.on('dispose', function() {
                    qualityButton.remove();
                    stretchButton.remove();
                });

                // ============ setStretchMode ============
                function setStretchMode(mode) {
                    if (!player) return;
                    const videoEl = player.el().querySelector('video');
                    if (!videoEl) return;

                    videoEl.style.transform = '';
                    videoEl.style.transformOrigin = 'center center';

                    if (mode === 'fill') {
                        videoEl.style.objectFit = 'fill';
                    } else if (mode === 'cover') {
                        videoEl.style.objectFit = 'cover';
                    } else if (mode.indexOf('zoom-') === 0) {
                        const zoom = parseInt(mode.split('-')[1], 10) / 100;
                        videoEl.style.objectFit = 'contain';
                        videoEl.style.transform = 'scale(' + zoom + ')';
                    } else {
                        videoEl.style.objectFit = 'contain';
                    }

                    currentStretchMode = mode;
                    updateStretchLabel(mode);

                    const menu = document.getElementById('stretchMenu');
                    if (menu) {
                        menu.querySelectorAll('.stretch-item').forEach(function(el) {
                            el.classList.toggle('active', el.dataset.mode === mode);
                        });
                    }
                }

                function updateStretchLabel(mode) {
                    const labelEl = document.getElementById('stretchLabel');
                    if (!labelEl) return;
                    const labels = {
                        'contain': 'ملائم',
                        'fill': 'تمديد',
                        'cover': 'تغطية',
                        'zoom-110': '110%',
                        'zoom-125': '125%',
                        'zoom-150': '150%',
                        'zoom-200': '200%'
                    };
                    labelEl.textContent = labels[mode] || 'ملائم';
                }

                function setAutoQuality() {
                    isAutoQuality = true;
                    const levels = player.qualityLevels ? player.qualityLevels() : null;
                    if (levels) for (let i = 0; i < levels.length; i++) levels[i].enabled = true;
                    const label = document.getElementById('qualityLabel');
                    if (label) label.textContent = 'تلقائي';
                    const menu = document.getElementById('qualityMenu');
                    if (menu) {
                        const items = menu.querySelectorAll('.quality-item');
                        items.forEach(el => el.classList.remove('active'));
                        const autoItem = menu.querySelector('.quality-item:first-child');
                        if (autoItem) autoItem.classList.add('active');
                    }
                }

                function buildQualityMenu(levels) {
                    const menu = document.getElementById('qualityMenu');
                    const label = document.getElementById('qualityLabel');
                    if (!menu) return;
                    menu.innerHTML = '';

                    const autoBtn = document.createElement('button');
                    autoBtn.className = 'quality-item';
                    autoBtn.textContent = 'تلقائي';
                    autoBtn.addEventListener('click', function(e) {
                        e.stopPropagation(); setAutoQuality(); menu.classList.remove('open');
                    });
                    menu.appendChild(autoBtn);
                    if (isAutoQuality) {
                        autoBtn.classList.add('active');
                        if (label) label.textContent = 'تلقائي';
                    }

                    const items = [];
                    for (let i = 0; i < levels.length; i++) {
                        const l = levels[i];
                        if (!l || typeof l.height !== 'number') continue;
                        let labelText = '';
                        if (l.height >= 720) labelText = 'HD';
                        else if (l.height >= 480) labelText = 'SD';
                        else labelText = l.height + 'p';
                        if (l.bitrate) {
                            const mbps = (l.bitrate / 1000000).toFixed(1);
                            labelText += ' ' + mbps + 'Mbps';
                        }
                        items.push({ level: l, label: labelText, height: l.height });
                    }
                    items.sort((a, b) => b.height - a.height);

                    let activeLevel = null;
                    for (const item of items) { if (item.level.enabled && !isAutoQuality) { activeLevel = item; break; } }

                    items.forEach(function(item) {
                        const btn = document.createElement('button');
                        btn.className = 'quality-item';
                        if (activeLevel && item.level === activeLevel.level) {
                            btn.classList.add('active');
                            btn.innerHTML = item.label + ' <span class="check">✓</span>';
                        } else { btn.textContent = item.label; }
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            isAutoQuality = false;
                            for (let i = 0; i < levels.length; i++) levels[i].enabled = false;
                            item.level.enabled = true;
                            const allItems = menu.querySelectorAll('.quality-item');
                            allItems.forEach(el => {
                                el.classList.remove('active');
                                const txt = el.textContent.replace(' ✓', '');
                                el.textContent = txt;
                            });
                            this.classList.add('active');
                            this.innerHTML = item.label + ' <span class="check">✓</span>';
                            if (label) {
                                const short = item.height >= 720 ? 'HD' : item.height >= 480 ? 'SD' : item.height + 'p';
                                label.textContent = short;
                            }
                            menu.classList.remove('open');
                        });
                        menu.appendChild(btn);
                    });
                }

                player.setStretchMode = setStretchMode;
            }

            // تحميل المصدر
            player.src({ src: src, type: 'application/x-mpegURL' });
            player.play().catch(function() {});

            // ============ toggleFullscreenLandscape (عند ضغط المستخدم) ============
            function toggleFullscreenLandscape() {
                if (!player) return;
                if (isTransitioning) return;
                const isFullscreen = player.isFullscreen ? player.isFullscreen() : false;

                if (!isFullscreen) {
                    isTransitioning = true;
                    try {
                        const p = player.requestFullscreen();
                        if (p && p.catch) p.catch(function() {});
                    } catch(e) {
                        try {
                            const el = player.el();
                            if (el && el.requestFullscreen) el.requestFullscreen();
                        } catch(e2) {}
                    }
                    setTimeout(function() { isTransitioning = false; }, 500);
                } else {
                    isTransitioning = true;
                    try { player.exitFullscreen(); } catch(e) {}
                    setTimeout(function() { isTransitioning = false; }, 500);
                }
            }

            player.toggleFullscreenLandscape = toggleFullscreenLandscape;

            // تطبيق أولي
            setTimeout(function() {
                videoClose.style.display = 'flex';
                if (player && player.showControls) player.showControls();
            }, 300);

            setTimeout(function() { if (player && player.el()) player.el().focus(); }, 400);
        }

        // ============ CLOSE VIDEO ============
        function closeVideo() {
            if (isClosing) return;
            isClosing = true;
            videoOverlay.classList.add('closing');

            setTimeout(function() {
                videoOverlay.classList.remove('active', 'closing');
                document.body.style.overflow = '';
                if (player) {
                    player.pause();
                    if (player.isFullscreen && player.isFullscreen()) {
                        try { player.exitFullscreen(); } catch (e) {}
                    }
                    if (player._resizeObserver) { try { player._resizeObserver.disconnect(); } catch (e) {} }
                }
                videoContainer.classList.add('normal');
                videoContainer.classList.remove('fullscreen-landscape');
                isClosing = false;
            }, 350);
        }

        videoClose.addEventListener('click', closeVideo);
        videoOverlay.addEventListener('click', function(e) { if (e.target === videoOverlay) closeVideo(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && videoOverlay.classList.contains('active')) closeVideo();
        });

        // ============ زر الرجوع ============
        window.addEventListener('popstate', function(e) {
            if (videoOverlay.classList.contains('active')) {
                if (player && player.isFullscreen && player.isFullscreen()) {
                    try { player.exitFullscreen(); } catch(ex) {}
                } else {
                    closeVideo();
                }
            }
        });

        // منع النسخ
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) || e.key === 'F12') {
                e.preventDefault();
            }
        });

        window.addEventListener('load', function() { document.body.classList.add('loaded'); });

        console.log('✅ المشغل جاهز — إخفاء تلقائي للوحة التحكم بعد 3 ثوانٍ أو بضغط الفيديو');
    })();
</script>

</body>
